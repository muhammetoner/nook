<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nook — Bugün Nereye Gidilir?</title>
<style>
  :root{
    --bg:#141210; --bg-soft:#1c1a16; --card:#221f1a; --line:#33302a;
    --ink:#f5f1e8; --muted:#a79f8f; --gold:#e0b04c; --coral:#e2683f; --teal:#4fa695;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}

  /* ---------- header ---------- */
  header{
    padding:22px 20px 16px; position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--coral));display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1712;font-size:14px;}
  .brand-text h1{font-size:18px; margin:0; letter-spacing:-0.02em;}
  .brand-text small{color:var(--muted); font-size:11px;}
  .tagline{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:26px; margin:4px 0 16px; letter-spacing:-0.01em;}
  .tagline b{color:var(--gold); font-style:normal;}

  .search{
    display:flex; gap:10px; background:var(--bg-soft); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px; align-items:center; margin-bottom:16px;
  }
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14px;}
  .search input::placeholder{color:var(--muted)}

  .row-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none;}
  .row-scroll::-webkit-scrollbar{display:none;}
  .city-tab{
    flex:none; padding:6px 4px; font-size:13px; color:var(--muted); cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap; font-weight:600;
  }
  .city-tab.active{color:var(--ink); border-color:var(--gold);}
  .cat-chip{
    flex:none; padding:6px 13px; border-radius:999px; font-size:12.5px; cursor:pointer;
    background:var(--bg-soft); border:1px solid var(--line); color:var(--muted); white-space:nowrap; margin-top:10px;
  }
  .cat-chip.active{background:var(--gold); border-color:var(--gold); color:#1a1712; font-weight:700;}

  main{max-width:1040px; margin:0 auto; padding:6px 20px 40px;}
  .section-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:30px 2px 14px;}
  .section-title .n{color:var(--ink); text-transform:none; font-weight:400; letter-spacing:0; font-size:12px;}

  /* ---------- featured carousel ---------- */
  .featured-row{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 10px; -ms-overflow-style:none; scrollbar-width:none;}
  .featured-row::-webkit-scrollbar{display:none;}
  .feat-card{
    flex:none; width:270px; height:190px; border-radius:18px; position:relative; overflow:hidden; cursor:pointer;
    background-size:cover; background-position:center; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .feat-card::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.85) 100%);}
  .feat-badge{position:absolute; top:10px; left:10px; z-index:2; background:rgba(20,18,16,.7); backdrop-filter:blur(4px); color:var(--gold); font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .feat-info{position:absolute; bottom:0; left:0; right:0; padding:14px; z-index:2;}
  .feat-info h3{margin:0 0 3px; font-size:16px;}
  .feat-info .sub{font-size:12px; color:#e6e1d6; opacity:.9;}

  /* ---------- grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer;
    transition:.15s; display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--gold);}
  .card .cover{height:130px; background-size:cover; background-position:center; position:relative;}
  .card .rate{position:absolute; top:8px; right:8px; background:rgba(20,18,16,.75); color:var(--gold); font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; display:flex; gap:3px; align-items:center;}
  .card .body{padding:13px;}
  .card .cat-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .card .cat{font-size:10.5px; font-weight:700; color:var(--coral); text-transform:uppercase; letter-spacing:.03em;}
  .card .price{font-size:12px; color:var(--gold); font-weight:700;}
  .card h3{margin:0 0 3px; font-size:15px;}
  .card p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.4; min-height:2.6em;}
  .card .meta{display:flex; gap:5px; align-items:center; margin-top:10px; font-size:11.5px; color:var(--muted);}

  .empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:14px;}

  /* ---------- detail sheet ---------- */
  .overlay{position:fixed; inset:0; background:rgba(8,7,6,.7); display:none; align-items:flex-end; justify-content:center; z-index:20;}
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg-soft); width:100%; max-width:560px; border-radius:22px 22px 0 0; overflow-y:auto; max-height:88vh;
    animation:up .2s ease-out; border:1px solid var(--line); border-bottom:none;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1}}
  .sheet-cover{height:170px; background-size:cover; background-position:center; position:relative;}
  .sheet-cover::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 50%, var(--bg-soft) 100%);}
  .sheet-body{padding:0 22px 26px;}
  .sheet h2{margin:0 0 6px; font-size:22px;}
  .sheet-tags{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px; font-size:12.5px; color:var(--muted);}
  .sheet-tags .rate{color:var(--gold); font-weight:700;}
  .sheet-tags .price{color:var(--gold);}
  .sheet .desc{font-size:13px; color:var(--muted); margin:10px 0 18px; line-height:1.5;}
  .menu-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:8px;}
  .menu-item{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line);}
  .menu-item:first-of-type{border-top:none;}
  .menu-item .name{font-weight:600; font-size:14px;}
  .menu-item .desc2{font-size:12px; color:var(--muted); margin-top:2px;}
  .menu-item .price2{font-weight:700; font-size:14px; white-space:nowrap; color:var(--gold);}
  .close-btn{width:100%; margin-top:20px; padding:13px; border-radius:12px; border:1px solid var(--line); background:none; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;}

  .status{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:11px; padding:6px 14px; border-radius:999px;}
  footer{text-align:center; padding:24px; color:var(--muted); font-size:12px;}
  footer a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-text"><h1>Nook</h1><small>yerel keşif rehberi</small></div>
    </div>
  </div>
  <div class="tagline">Bugün <b>nereye</b> gidilir?</div>
  <div class="search">
    <span>🔎</span>
    <input placeholder="Mekan, kategori veya lezzet ara..." id="searchInput" />
  </div>
  <div class="row-scroll" id="cityTabs"></div>
  <div class="row-scroll" id="catChips"></div>
</header>

<main>
  <div class="section-title">✨ Öne Çıkanlar</div>
  <div class="featured-row" id="featuredRow"></div>

  <div class="section-title"><span id="listTitle">Tüm Mekanlar</span> <span class="n" id="listCount"></span></div>
  <div class="grid" id="grid"></div>
</main>

<footer>Nook · <a href="../admin/">Yönetici girişi</a></footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-cover" id="sheetCover"></div>
    <div class="sheet-body">
      <h2 id="sheetName"></h2>
      <div class="sheet-tags" id="sheetTags"></div>
      <div class="desc" id="sheetDesc"></div>
      <div class="menu-title">Menü</div>
      <div id="sheetMenu"></div>
      <button class="close-btn" onclick="closeSheet()">Kapat</button>
    </div>
  </div>
</div>

<div class="status" id="statusBadge">🔌 bağlanılıyor...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://iwkoxixoyjaxqsbjsjak.supabase.co';
const SUPABASE_KEY = 'sb_publishable_biY8I92YYNjwhG7gsff_yw_Sj8etOmt';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = ['Tümü','Yemek','Kafe','Restoran','Bar','Tatlıcı','Kahvaltı'];
const CATEGORY_ICON = {'Yemek':'🍢','Kafe':'☕','Restoran':'🍽️','Bar':'🍸','Tatlıcı':'🍮','Kahvaltı':'🥐'};

let countries = [], cities = [], businesses = [];
const menuCache = {};
let activeCity = 'all';
let activeCat = 'Tümü';

function cityName(id){ return cities.find(c=>c.id===id)?.name ?? ''; }
function countryOfCity(cityId){
  const c = cities.find(c=>c.id===cityId);
  return countries.find(co=>co.id===c?.country_id)?.name ?? '';
}
function currencyFor(cityId){
  return countryOfCity(cityId) === 'Türkiye' ? '₺' : '€';
}
function priceTag(level){ return level ? '₺'.repeat(level) : ''; }
function coverStyle(b){ return b.image_url ? `background-image:url('${b.image_url}')` : `background:linear-gradient(135deg,#333,#555)`; }

async function loadData(){
  const badge = document.getElementById('statusBadge');
  const [{data:c, error:e1}, {data:ci, error:e2}, {data:b, error:e3}] = await Promise.all([
    sb.from('countries').select('*').order('name'),
    sb.from('cities').select('*').order('name'),
    sb.from('businesses').select('*').order('rating', {ascending:false}),
  ]);
  if(e1||e2||e3){
    badge.textContent = '🔴 Supabase\'e bağlanılamadı';
    document.getElementById('grid').innerHTML = `<div class="empty">Veriler yüklenemedi.</div>`;
    return;
  }
  countries = c; cities = ci; businesses = b;
  badge.textContent = `🟢 canlı — ${businesses.length} mekan, ${cities.length} şehir`;
  renderTabs();
  renderChips();
  renderFeatured();
  renderGrid();
}

function renderTabs(){
  const wrap = document.getElementById('cityTabs');
  const all = [{id:'all', name:'Tüm Şehirler'}, ...cities];
  wrap.innerHTML = all.map(c => `<div class="city-tab ${activeCity==c.id?'active':''}" data-id="${c.id}">${c.name}</div>`).join('');
  wrap.querySelectorAll('.city-tab').forEach(t => t.onclick = () => { activeCity = t.dataset.id === 'all' ? 'all' : Number(t.dataset.id); renderTabs(); renderGrid(); });
}
function renderChips(){
  const wrap = document.getElementById('catChips');
  wrap.innerHTML = CATEGORIES.map(cat => `<div class="cat-chip ${activeCat===cat?'active':''}" data-cat="${cat}">${CATEGORY_ICON[cat]||'✨'} ${cat}</div>`).join('');
  wrap.querySelectorAll('.cat-chip').forEach(t => t.onclick = () => { activeCat = t.dataset.cat; renderChips(); renderGrid(); });
}

function renderFeatured(){
  const row = document.getElementById('featuredRow');
  const featured = businesses.filter(b=>b.featured);
  if(!featured.length){ row.innerHTML = `<div class="empty">Henüz öne çıkan mekan yok.</div>`; return; }
  row.innerHTML = featured.map(b => `
    <div class="feat-card" style="${coverStyle(b)}" data-id="${b.id}">
      <div class="feat-badge">⭐ ${b.rating ?? '–'}</div>
      <div class="feat-info">
        <h3>${b.name}</h3>
        <div class="sub">${cityName(b.city_id)} · ${b.category||''} · ${priceTag(b.price_level)}</div>
      </div>
    </div>
  `).join('');
  row.querySelectorAll('.feat-card').forEach(el => el.onclick = () => openSheet(Number(el.dataset.id)));
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = businesses.filter(b => activeCity === 'all' || b.city_id === activeCity);
  if(activeCat !== 'Tümü') list = list.filter(b => b.category === activeCat);
  if(q){
    list = list.filter(b =>
      b.name.toLowerCase().includes(q) || (b.category||'').toLowerCase().includes(q) || (b.description||'').toLowerCase().includes(q)
    );
  }
  document.getElementById('listTitle').textContent = activeCity === 'all' ? 'Tüm Mekanlar' : cityName(activeCity) + ' Mekanları';
  document.getElementById('listCount').textContent = `${list.length} sonuç`;

  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty">Aramanla eşleşen mekan bulunamadı.</div>`;
    return;
  }
  grid.innerHTML = list.map(b => `
    <div class="card" data-id="${b.id}">
      <div class="cover" style="${coverStyle(b)}">${b.rating ? `<div class="rate">⭐ ${b.rating}</div>` : ''}</div>
      <div class="body">
        <div class="cat-row">
          <span class="cat">${CATEGORY_ICON[b.category]||''} ${b.category||''}</span>
          <span class="price">${priceTag(b.price_level)}</span>
        </div>
        <h3>${b.name}</h3>
        <p>${b.description||''}</p>
        <div class="meta">📍 ${cityName(b.city_id)}, ${countryOfCity(b.city_id)}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(el => el.onclick = () => openSheet(Number(el.dataset.id)));
}

async function openSheet(id){
  const b = businesses.find(x=>x.id===id);
  document.getElementById('sheetCover').style.cssText = coverStyle(b);
  document.getElementById('sheetName').textContent = b.name;
  document.getElementById('sheetTags').innerHTML = `
    ${b.rating ? `<span class="rate">⭐ ${b.rating}</span>` : ''}
    <span>·</span><span>${CATEGORY_ICON[b.category]||''} ${b.category||''}</span>
    <span>·</span><span class="price">${priceTag(b.price_level)}</span>
    <span>·</span><span>📍 ${cityName(b.city_id)}, ${countryOfCity(b.city_id)}</span>
  `;
  document.getElementById('sheetDesc').textContent = b.description || '';
  document.getElementById('sheetMenu').innerHTML = `<div class="empty">Menü yükleniyor...</div>`;
  document.getElementById('overlay').classList.add('open');

  if(!menuCache[id]){
    const {data} = await sb.from('menus').select('*').eq('business_id', id).order('title');
    menuCache[id] = data || [];
  }
  const items = menuCache[id];
  const cur = currencyFor(b.city_id);
  document.getElementById('sheetMenu').innerHTML = items.length
    ? items.map(m => `
        <div class="menu-item">
          <div><div class="name">${m.title}</div><div class="desc2">${m.description||''}</div></div>
          <div class="price2">${Number(m.price).toFixed(cur==='₺'?0:2)} ${cur}</div>
        </div>
      `).join('')
    : `<div class="empty">Bu mekan için henüz menü eklenmemiş.</div>`;
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeSheet(); });
document.getElementById('searchInput').addEventListener('input', renderGrid);

loadData();
</script>
</body>
</html>
