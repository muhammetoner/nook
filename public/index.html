<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>biMekan</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1b19; --muted:#6b6660;
    --accent:#e2622a; --line:#e9e6e0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  header{
    padding:28px 20px 20px; background:linear-gradient(135deg,#20201e,#3a2a20);
    color:#fff; position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;}
  .brand h1{font-size:20px; margin:0; letter-spacing:-0.02em;}
  .brand small{display:block; opacity:.65; font-weight:400; font-size:12px; margin-top:2px;}
  .search{
    display:flex; gap:8px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 14px; align-items:center;
  }
  .search input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;}
  .search input::placeholder{color:rgba(255,255,255,.5)}
  .tabs{display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px;}
  .tab{
    flex:none; padding:7px 14px; border-radius:999px; font-size:13px; cursor:pointer;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; white-space:nowrap;
    transition:.15s;
  }
  .tab.active{background:var(--accent); border-color:var(--accent); font-weight:600;}

  main{max-width:920px; margin:0 auto; padding:20px;}
  .section-title{font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:22px 4px 12px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer;
    transition:.15s; display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .card .cover{height:120px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; background-size:cover; background-position:center;}
  .card .body{padding:14px;}
  .card .cat{display:inline-block; font-size:11px; font-weight:700; color:var(--accent); background:#fdeee5; padding:3px 9px; border-radius:999px; margin-bottom:8px;}
  .card h3{margin:0 0 4px; font-size:16px;}
  .card p{margin:0; font-size:13px; color:var(--muted); line-height:1.4;}
  .card .meta{display:flex; gap:6px; align-items:center; margin-top:10px; font-size:12px; color:var(--muted);}

  .empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:14px;}

  .overlay{position:fixed; inset:0; background:rgba(20,18,15,.5); display:none; align-items:flex-end; justify-content:center; z-index:20;}
  .overlay.open{display:flex;}
  .sheet{
    background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px 22px 28px;
    animation:up .2s ease-out; max-height:80vh; overflow-y:auto;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1}}
  .sheet-cover{height:100px; border-radius:14px; margin-bottom:14px; display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff; background-size:cover; background-position:center;}
  .sheet h2{margin:0 0 2px; font-size:20px;}
  .sheet .loc{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .menu-item{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line);}
  .menu-item:first-of-type{border-top:none;}
  .menu-item .name{font-weight:600; font-size:14px;}
  .menu-item .desc{font-size:12px; color:var(--muted); margin-top:2px;}
  .menu-item .price{font-weight:700; font-size:14px; white-space:nowrap; color:var(--accent);}
  .close-btn{width:100%; margin-top:18px; padding:12px; border-radius:12px; border:none; background:var(--ink); color:#fff; font-size:14px; font-weight:600; cursor:pointer;}

  .status{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:#1c1b19; color:#fff; font-size:11px; padding:6px 14px; border-radius:999px; opacity:.75;
  }
  footer{text-align:center; padding:24px; color:var(--muted); font-size:12px;}
  footer a{color:var(--accent); text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">bM</div>
    <div>
      <h1>biMekan</h1>
      <small>Şehrindeki mekanları ve menüleri keşfet</small>
    </div>
  </div>
  <div class="search">
    <span>🔎</span>
    <input placeholder="Mekan, kategori veya lezzet ara..." id="searchInput" />
  </div>
  <div class="tabs" id="cityTabs"></div>
</header>

<main>
  <div class="section-title" id="listTitle">Mekanlar yükleniyor...</div>
  <div class="grid" id="grid"></div>
</main>

<footer>biMekan · <a href="../admin/">Yönetici girişi</a></footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-cover" id="sheetCover"></div>
    <h2 id="sheetName"></h2>
    <div class="loc" id="sheetLoc"></div>
    <div id="sheetMenu"></div>
    <button class="close-btn" onclick="closeSheet()">Kapat</button>
  </div>
</div>

<div class="status" id="statusBadge">🔌 bağlanılıyor...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://iwkoxixoyjaxqsbjsjak.supabase.co';
const SUPABASE_KEY = 'sb_publishable_biY8I92YYNjwhG7gsff_yw_Sj8etOmt';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORY_STYLE = {
  'Yemek':    {emoji:'🍢', color:'#e2622a'},
  'Kafe':     {emoji:'☕', color:'#6b4f3a'},
  'Restoran': {emoji:'🥐', color:'#3a5a8c'},
};
function styleFor(category){ return CATEGORY_STYLE[category] || {emoji:'📍', color:'#555'}; }

let cities = [];
let countries = [];
let businesses = [];
const menuCache = {};
let activeCity = 'all';

function cityName(id){ return cities.find(c=>c.id===id)?.name ?? ''; }
function countryOfCity(cityId){
  const c = cities.find(c=>c.id===cityId);
  return countries.find(co=>co.id===c?.country_id)?.name ?? '';
}

async function loadData(){
  const badge = document.getElementById('statusBadge');
  const [{data:c, error:e1}, {data:ci, error:e2}, {data:b, error:e3}] = await Promise.all([
    sb.from('countries').select('*').order('name'),
    sb.from('cities').select('*').order('name'),
    sb.from('businesses').select('*').order('name'),
  ]);
  if(e1||e2||e3){
    badge.textContent = '🔴 Supabase\'e bağlanılamadı';
    document.getElementById('grid').innerHTML = `<div class="empty">Veriler yüklenemedi.</div>`;
    return;
  }
  countries = c; cities = ci; businesses = b;
  badge.textContent = '🟢 canlı — Supabase';
  renderTabs();
  renderGrid();
}

function renderTabs(){
  const wrap = document.getElementById('cityTabs');
  const all = [{id:'all', name:'Tümü'}, ...cities];
  wrap.innerHTML = all.map(c => `<div class="tab ${activeCity==c.id?'active':''}" data-id="${c.id}">${c.name}</div>`).join('');
  wrap.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeCity = t.dataset.id === 'all' ? 'all' : Number(t.dataset.id); renderTabs(); renderGrid(); });
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const title = document.getElementById('listTitle');
  title.textContent = activeCity === 'all' ? 'Tüm Mekanlar' : cityName(activeCity) + ' Mekanları';

  let list = businesses.filter(b => activeCity === 'all' || b.city_id === activeCity);
  if(q){
    list = list.filter(b =>
      b.name.toLowerCase().includes(q) || (b.category||'').toLowerCase().includes(q) || (b.description||'').toLowerCase().includes(q)
    );
  }

  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty">Aramanla eşleşen mekan bulunamadı.</div>`;
    return;
  }
  grid.innerHTML = list.map(b => {
    const s = styleFor(b.category);
    const coverStyle = b.image_url ? `background-image:url('${b.image_url}')` : `background:${s.color}`;
    return `
    <div class="card" data-id="${b.id}">
      <div class="cover" style="${coverStyle}">${b.image_url ? '' : s.emoji}</div>
      <div class="body">
        <span class="cat">${b.category||''}</span>
        <h3>${b.name}</h3>
        <p>${b.description||''}</p>
        <div class="meta">📍 ${cityName(b.city_id)}, ${countryOfCity(b.city_id)}</div>
      </div>
    </div>
  `;}).join('');
  grid.querySelectorAll('.card').forEach(el => el.onclick = () => openSheet(Number(el.dataset.id)));
}

async function openSheet(id){
  const b = businesses.find(x=>x.id===id);
  const s = styleFor(b.category);
  const coverStyle = b.image_url ? `background-image:url('${b.image_url}')` : `background:${s.color}`;
  const cover = document.getElementById('sheetCover');
  cover.style.cssText = coverStyle;
  cover.textContent = b.image_url ? '' : s.emoji;
  document.getElementById('sheetName').textContent = b.name;
  document.getElementById('sheetLoc').textContent = `📍 ${cityName(b.city_id)}, ${countryOfCity(b.city_id)} · ${b.category||''}`;
  document.getElementById('sheetMenu').innerHTML = `<div class="empty">Menü yükleniyor...</div>`;
  document.getElementById('overlay').classList.add('open');

  if(!menuCache[id]){
    const {data} = await sb.from('menus').select('*').eq('business_id', id).order('title');
    menuCache[id] = data || [];
  }
  const items = menuCache[id];
  document.getElementById('sheetMenu').innerHTML = items.length
    ? items.map(m => `
        <div class="menu-item">
          <div><div class="name">${m.title}</div><div class="desc">${m.description||''}</div></div>
          <div class="price">${Number(m.price).toFixed(0)} ₺</div>
        </div>
      `).join('')
    : `<div class="empty">Bu mekan için henüz menü eklenmemiş.</div>`;
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeSheet(); });
document.getElementById('searchInput').addEventListener('input', renderGrid);

loadData();
</script>
</body>
</html>
